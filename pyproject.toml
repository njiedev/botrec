[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "botrec"
version = "0.1.0"
description = "Read, write and edit Deadlock bot recording share codes"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["zstandard>=0.22"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
botrec = "botrec.__main__:main"

[tool.setuptools]
packages = ["botrec"]
